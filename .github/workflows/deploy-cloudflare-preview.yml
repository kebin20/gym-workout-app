name: Deploy Liftline Cloudflare preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liftline-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LIFTLINE_CLOUDFLARE_D1_DATABASE_ID: ${{ vars.LIFTLINE_CLOUDFLARE_D1_DATABASE_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

      - name: Check preview deployment target
        run: node scripts/check-cloudflare-deploy-config.mjs

      - name: Apply preview database migrations
        run: npx wrangler d1 migrations apply liftline-cloudflare-preview --remote --config dist/server/wrangler.json

      - name: Deploy preview Worker
        run: npm run deploy:cloudflare:preview
