name: Liftline regression checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
      - run: npm run test:regression
